<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH · 交互关键帧验收</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font: 16px/1.6 -apple-system, BlinkMacSystemFont, sans-serif; color: white;
    background: radial-gradient(ellipse at 87% 45%, #b1a2f2 0, transparent 48%), radial-gradient(ellipse at 58% 90%, #7674ea 0, transparent 48%), linear-gradient(125deg, #052da7, #0648d0 48%, #7c70da); }
  main { max-width: 780px; margin: auto; padding: 30px 28px; }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 6px; }
  p { opacity: .8; margin: 0 0 18px; }
  textarea, [contenteditable], #readonly { display: block; width: 100%; padding: 14px; border: 1px solid #ffffff55; border-radius: 12px; background: #ffffffee; color: #172844; font: inherit; }
  .fixtures { margin-top: 380px; }
  .fixtures > * { margin-bottom: 14px; }
  small { opacity: .7; }
</style>
<main>
  <h1>DSH · 交互关键帧验收</h1>
  <p>点击输入框可生成段落，选中文字可改写；开始打字或点击空白处会隐藏入口。</p>
  <textarea id="doc" rows="2">这个方案需要进一步优化。</textarea>
  <div class="fixtures">
    <div id="editable" contenteditable="true">第二段内容也可以直接编辑。</div>
    <div id="readonly">这是一段只能复制、不能直接替换的文本。</div>
    <div id="blocks" contenteditable="true"><p>第一段文字。</p><p>第二段文字。</p></div>
    <small>此页使用模拟返回，方便检查界面状态；不连接模型服务。</small>
  </div>
</main>
<script>
  window.uiMessages = [];
  window.chrome ??= {};
  window.chrome.runtime = { sendMessage: async message => {
    uiMessages.push(message);
    if (message.type === 'rewrite') {
      await new Promise(resolve => setTimeout(resolve, 4000));
      return { ok: true, replacement: '建议进一步完善此方案，明确实施路径与验收标准。' };
    }
    if (message.type === 'desktop-open') return { ok: false, error: { message: '演示页未连接桌面服务。' } };
    return { ok: true };
  } };
</script>
<script src="../src/edit-protocol.js"></script>
<script src="../src/target-registry.js"></script>
<script src="../src/adapters/input.js"></script>
<script src="../src/adapters/richtext.js"></script>
<script src="../src/adapters/feishu.js"></script>
<script src="../src/edit-core.js"></script>
<script src="../src/page-channel.js"></script>
<script src="../src/content.js"></script>
</html>
